# Local Kubernetes that mirrors the EKS shape closely enough to test the
# chart, policies and GitOps flow: same minor version as EKS (1.36), three
# nodes labelled with three "zones" so topology spreading is exercised, and
# kindnet NetworkPolicy enforcement.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sentinel
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    labels:
      topology.kubernetes.io/zone: local-a
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    labels:
      topology.kubernetes.io/zone: local-b
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    labels:
      topology.kubernetes.io/zone: local-c
