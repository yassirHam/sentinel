# Wave -1: Sentinel admission policies, before any workload syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sentinel
  source:
    repoURL: https://github.com/yassirHam/sentinel-orion.git
    targetRevision: master
    path: sentinel/deploy/policies/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true      # a policy deleted or edited by hand is restored
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
