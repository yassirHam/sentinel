# Wave -2: the policy engine itself (upstream chart pinned + our values from Git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sentinel
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.2
      helm:
        valueFiles:
          - $values/sentinel/deploy/platform/kyverno-values.yaml
    - repoURL: https://github.com/yassirHam/sentinel-orion.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: false        # never auto-delete the admission controller
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # Kyverno CRDs exceed the client-side annotation size limit
