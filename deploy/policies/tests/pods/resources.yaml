# Hand-written admission cases: one compliant pod and one pod per violation.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: sentinel-dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: sentinel-sample-service:0.2.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { memory: 256Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: good-ecr-digest
  namespace: sentinel-prod
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: 123456789012.dkr.ecr.eu-west-3.amazonaws.com/sentinel/sample-service@sha256:51276b5f73b9f209ba22cc18032670799eee457d824b4e0c56c33ea1f8024a46
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 50m, memory: 96Mi }
        limits: { memory: 256Mi }
---
