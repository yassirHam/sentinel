{{- if .Values.networkPolicy.enabled }}
# Zero-trust by default: only listed namespaces may call the service, and the
# pod may not open any outbound connection except DNS (it needs none; a
# compromised pod cannot reach the cloud metadata API, other services or the
# internet).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sentinel-service.fullname" . }}
  labels:
    {{- include "sentinel-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sentinel-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}   # same namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
