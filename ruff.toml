line-length = 110
target-version = "py313"
extend-exclude = [".venv"]

[lint]
# pyflakes, pycodestyle, isort, bugbear, bandit (security), pyupgrade
select = ["F", "E", "W", "I", "B", "S", "UP"]
ignore = [
  "S104", # binding 0.0.0.0 is intended inside the container
]

[lint.per-file-ignores]
"tests/**" = ["S101"]          # assert is how pytest works
"infra/**/tests/**" = ["S101", "S603", "S607", "E501"]
"scripts/**" = ["S310", "S101", "S603", "S607", "E501"] # operator scripts: urllib on operator URLs, asserts, argv-list subprocess calls to pinned tools (no shell)
"tools/**" = ["S310", "S202", "S603"]   # pinned https downloads; archives verified by sha256 before extraction
